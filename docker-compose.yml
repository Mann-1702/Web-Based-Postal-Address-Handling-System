version: "3.8"

services:
  mysqllocal:
    image: mysql:9.2.0
    container_name: mysqllocal
    restart: always
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: addressdb
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysqllocal-adminer:
    image: adminer
    container_name: mysqllocal-adminer
    restart: always
    platform: linux/amd64
    environment:
      ADMINER_DEFAULT_SERVER: mysqllocal
    ports:
      - "8081:8080"

  address-manager:
    build:
      context: ../AddressManager
      dockerfile: Dockerfile
    container_name: address-manager
    platform: linux/amd64
    restart: always
    depends_on:
      mysqllocal:
        condition: service_healthy
    ports:
      - "9091:9091"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqllocal:3306/addressdb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
